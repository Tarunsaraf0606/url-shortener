<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .user-info.show {
            display: flex;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #ee5a6f;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .result-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .short-url {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .short-url input {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
        }

        .urls-list {
            margin-top: 20px;
        }

        .url-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }

        .url-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .url-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .url-info {
            flex: 1;
        }

        .url-long {
            color: #666;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 8px;
        }

        .url-short {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }

        .url-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .url-actions {
            display: flex;
            gap: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 15px 30px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }

        .tab.active {
            color: #667eea;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .main-card {
                padding: 20px;
            }

            .url-header {
                flex-direction: column;
            }

            .url-actions {
                margin-top: 10px;
            }

            .user-info {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 URL Shortener</h1>
            <p>Create short, memorable links in seconds</p>
        </div>

        <div class="user-info" id="user-info">
            <div class="user-details">
                <span id="user-email"></span>
                <span id="user-provider"></span>
            </div>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>

        <div class="main-card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('create')">Create Short URL</button>
                <button class="tab" onclick="switchTab('manage')">My URLs</button>
            </div>

            <!-- Create URL Tab -->
            <div id="create-tab" class="tab-content active">
                <div class="alert" id="alert"></div>

                <form id="url-form">
                    <div class="form-group">
                        <label for="long-url">Enter your long URL *</label>
                        <input 
                            type="url" 
                            id="long-url" 
                            placeholder="https://example.com/very/long/url/that/needs/shortening"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="custom-alias">Custom Alias (optional)</label>
                        <input 
                            type="text" 
                            id="custom-alias" 
                            placeholder="my-custom-link"
                            pattern="[a-zA-Z0-9-_]+"
                            title="Only letters, numbers, hyphens, and underscores allowed"
                        >
                        <small style="color: #666;">3-50 characters, letters, numbers, hyphens and underscores only</small>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="use-base64">
                        <label for="use-base64">Use deterministic short code (same URL = same code)</label>
                    </div>

                    <div class="form-group">
                        <label for="expiry-date">Expiration Date (optional)</label>
                        <input 
                            type="datetime-local" 
                            id="expiry-date"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">Shorten URL</button>
                </form>

                <div class="result-box" id="result-box">
                    <h3>Your shortened URL is ready! 🎉</h3>
                    <div class="short-url">
                        <input type="text" id="short-url-display" readonly>
                        <button class="btn btn-secondary" onclick="copyUrl()">Copy</button>
                    </div>
                </div>
            </div>

            <!-- Manage URLs Tab -->
            <div id="manage-tab" class="tab-content">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Loading your URLs...</p>
                </div>

                <div id="urls-container" style="display: none;">
                    <div class="urls-list" id="urls-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = window.location.origin;
        let isAuthenticated = false;
        let currentUser = null;

        // Check authentication on page load
        async function checkAuth() {
            console.log('🔍 Checking authentication...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/profile`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    isAuthenticated = true;
                    
                    console.log('✅ Authenticated as:', currentUser.email);
                    
                    // Show user info
                    const userInfo = document.getElementById('user-info');
                    const userEmail = document.getElementById('user-email');
                    const userProvider = document.getElementById('user-provider');
                    
                    userEmail.textContent = `👤 ${currentUser.email}`;
                    userProvider.textContent = `(${currentUser.provider || 'unknown'})`;
                    userProvider.style.fontSize = '0.9em';
                    userProvider.style.opacity = '0.8';
                    userInfo.classList.add('show');
                    
                    // Enable form
                    enableForm();
                } else {
                    console.log('❌ Not authenticated');
                    isAuthenticated = false;
                    showLoginPrompt();
                }
            } catch (error) {
                console.error('❌ Auth check failed:', error);
                isAuthenticated = false;
                showLoginPrompt();
            }
        }

        // Enable form
        function enableForm() {
            const form = document.getElementById('url-form');
            form.style.pointerEvents = 'auto';
            form.style.opacity = '1';
            
            // Remove any error alerts
            const alert = document.getElementById('alert');
            if (alert.classList.contains('alert-error')) {
                alert.classList.remove('show');
            }
        }

        // Show login prompt
        function showLoginPrompt() {
            const alert = document.getElementById('alert');
            alert.className = 'alert alert-info show';
            alert.innerHTML = '⚠️ Please <a href="/auth" style="color: #0c5460; text-decoration: underline; font-weight: bold;">login</a> first to use the URL shortener.';
            
            // Disable form
            const form = document.getElementById('url-form');
            form.style.pointerEvents = 'none';
            form.style.opacity = '0.5';
        }

        // Logout
        async function logout() {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    console.log('✅ Logged out successfully');
                    window.location.href = '/';
                } else {
                    console.error('❌ Logout failed');
                    showAlert('Failed to logout', 'error');
                }
            } catch (error) {
                console.error('❌ Logout error:', error);
                showAlert('Network error during logout', 'error');
            }
        }

        // Run auth check on page load
        checkAuth();

        // Show alert message
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Load URLs if switching to manage tab
            if (tabName === 'manage') {
                loadUrls();
            }
        }

        // Create short URL
        document.getElementById('url-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!isAuthenticated) {
                showAlert('Please login first', 'error');
                return;
            }

            const longUrl = document.getElementById('long-url').value;
            const customAlias = document.getElementById('custom-alias').value;
            const expiryDate = document.getElementById('expiry-date').value;
            const useBase64 = document.getElementById('use-base64').checked;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            console.log('🔗 Creating short URL:', { longUrl, customAlias, expiryDate, useBase64 });

            try {
                const response = await fetch(`${API_BASE_URL}/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        long_url: longUrl,
                        custom_alias: customAlias || null,
                        expiry_date: expiryDate || null,
                        use_base64: useBase64
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    console.log('✅ URL created:', data);
                    showAlert(data.message || 'URL shortened successfully!', 'success');
                    document.getElementById('short-url-display').value = data.data.short_url;
                    document.getElementById('result-box').classList.add('show');
                    document.getElementById('url-form').reset();
                } else {
                    console.error('❌ Failed to create URL:', data);
                    showAlert(data.detail || 'Failed to shorten URL', 'error');
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Shorten URL';
            }
        });

        // Copy URL to clipboard
        function copyUrl() {
            const input = document.getElementById('short-url-display');
            navigator.clipboard.writeText(input.value).then(() => {
                showAlert('URL copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback for older browsers
                input.select();
                document.execCommand('copy');
                showAlert('URL copied to clipboard!', 'success');
            });
        }

        // Load user's URLs
        async function loadUrls() {
            if (!isAuthenticated) {
                document.getElementById('loading').innerHTML = '<p>Please login to view your URLs</p>';
                return;
            }

            const loading = document.getElementById('loading');
            const container = document.getElementById('urls-container');
            const urlsList = document.getElementById('urls-list');

            loading.style.display = 'block';
            container.style.display = 'none';

            console.log('📋 Loading URLs...');

            try {
                const response = await fetch(`${API_BASE_URL}/urls`, {
                    credentials: 'include'
                });

                const data = await response.json();

                loading.style.display = 'none';
                container.style.display = 'block';

                if (data.success && data.data.length > 0) {
                    console.log(`✅ Loaded ${data.data.length} URLs`);
                    urlsList.innerHTML = data.data.map(url => createUrlItem(url)).join('');
                } else {
                    console.log('📭 No URLs found');
                    urlsList.innerHTML = `
                        <div class="empty-state">
                            <h3>No URLs yet</h3>
                            <p>Create your first short URL to get started</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Error loading URLs:', error);
                loading.innerHTML = '<p>Failed to load URLs. Please try again.</p>';
            }
        }

        // Create URL item HTML
        function createUrlItem(url) {
            const shortUrl = `${API_BASE_URL}/${url.short_code}`;
            const createdDate = new Date(url.created_at).toLocaleDateString();
            
            return `
                <div class="url-item">
                    <div class="url-header">
                        <div class="url-info">
                            <div class="url-long">${escapeHtml(url.long_url)}</div>
                            <div class="url-short">
                                <a href="${shortUrl}" target="_blank">${shortUrl}</a>
                            </div>
                            <div class="url-stats">
                                <div class="stat-item">
                                    <span>👆</span>
                                    <span>${url.clicks} clicks</span>
                                </div>
                                <div class="stat-item">
                                    <span>📅</span>
                                    <span>${createdDate}</span>
                                </div>
                                ${url.expiry_date ? `
                                <div class="stat-item">
                                    <span>⏰</span>
                                    <span>Expires: ${new Date(url.expiry_date).toLocaleDateString()}</span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        <div class="url-actions">
                            <button class="btn btn-secondary" onclick="copyToClipboard('${shortUrl}')">Copy</button>
                            <button class="btn btn-danger" onclick="deleteUrl('${url.short_code}')">Delete</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Copy to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('URL copied to clipboard!', 'success');
            });
        }

        // Delete URL
        async function deleteUrl(shortCode) {
            if (!confirm('Are you sure you want to delete this URL?')) {
                return;
            }

            console.log('🗑️ Deleting URL:', shortCode);

            try {
                const response = await fetch(`${API_BASE_URL}/urls/${shortCode}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    console.log('✅ URL deleted');
                    showAlert('URL deleted successfully!', 'success');
                    loadUrls(); // Reload the list
                } else {
                    console.error('❌ Failed to delete:', data);
                    showAlert(data.detail || 'Failed to delete URL', 'error');
                }
            } catch (error) {
                console.error('❌ Delete error:', error);
                showAlert('Network error. Please try again.', 'error');
            }
        }
    </script>
</body>
</html>
